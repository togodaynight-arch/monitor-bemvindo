services:
  - type: web
    name: monitor-bemvindo
    runtime: node
    buildCommand: ""
    startCommand: node server-monitor.js
    plan: free
    envVars:
      - key: PORT
        value: "10000"

  - type: web
    name: e4-dashboard
    runtime: node
    buildCommand: ""
    startCommand: node server-unificado.js
    plan: free
    envVars:
      - key: PORT
        value: "3000"

  - type: web
    name: controle-nf-boletos
    runtime: node
    buildCommand: ""
    startCommand: node nf-controle/server.js
    plan: free

  - type: web
    name: relatorios-dia
    runtime: node
    buildCommand: ""
    startCommand: node relatorios-dia/server.js
    plan: free
